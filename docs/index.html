<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfterMath API - Swagger UI</title>
  <meta name="description" content="Swagger UI for the AfterMath OpenAPI 3.1 spec: whale and retail positioning, Telegram funnel scoring, and the live MCP endpoint.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.18.2/swagger-ui.min.css">
  <style>
    /* Stock Swagger UI. Only page colors + a dark mode; no layout overrides. */
    :root { --bg: #ffffff; --fg: #3b4151; --muted: #6b7280; --panel: #f7f7f7; --line: #d8dde6; --link: #0969da; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9aa4b2; --panel: #161b22; --line: #30363d; --link: #58a6ff; } }
    :root[data-theme="dark"] { --bg: #0d1117; --fg: #e6edf3; --muted: #9aa4b2; --panel: #161b22; --line: #30363d; --link: #58a6ff; }
    html { color-scheme: light dark; }
    body { margin: 0; background: var(--bg); color: var(--fg); }
    .swagger-ui .topbar { display: none; }
    .swagger-ui, .swagger-ui .info .title, .swagger-ui .info p, .swagger-ui .info li, .swagger-ui .opblock-tag,
    .swagger-ui .opblock .opblock-summary-description, .swagger-ui .opblock-description-wrapper p,
    .swagger-ui .parameter__name, .swagger-ui .parameter__type, .swagger-ui table thead tr td, .swagger-ui table thead tr th,
    .swagger-ui .response-col_status, .swagger-ui .response-col_description, .swagger-ui .tab li, .swagger-ui label,
    .swagger-ui .model-title, .swagger-ui .model, .swagger-ui section.models h4, .swagger-ui .opblock-section-header h4,
    .swagger-ui .opblock-section-header label, .swagger-ui .responses-inner h4, .swagger-ui .responses-inner h5 { color: var(--fg); }
    .swagger-ui .info a, .swagger-ui a { color: var(--link); }
    .swagger-ui .opblock-tag, .swagger-ui section.models, .swagger-ui section.models.is-open h4 { border-color: var(--line); }
    .swagger-ui .opblock .opblock-section-header, .swagger-ui section.models .model-container, .swagger-ui .scheme-container { background: var(--panel); box-shadow: none; }
    .swagger-ui input[type=text], .swagger-ui textarea, .swagger-ui select { background: var(--bg); color: var(--fg); border-color: var(--line); }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.18.2/swagger-ui-bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.18.2/swagger-ui-standalone-preset.min.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      window.ui = SwaggerUIBundle({
        url: '/api/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        plugins: [SwaggerUIBundle.plugins.DownloadUrl],
        layout: 'BaseLayout',
        tryItOutEnabled: true,
        displayRequestDuration: true,
        docExpansion: 'list',
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1
      });
    });
  </script>
</body>
</html>
