proxy_cache_path /var/cache/nginx/ah levels=1:2 keys_zone=ahapi:10m max_size=64m inactive=10m use_temp_path=off;

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Universal CORS headers for API and MCP consumers
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ---- Live AfterHour read-only proxy for /live (browsers cannot call api.afterhour.com: CORS) ----
    # Whitelisted public GETs only, shared micro-cache, so N viewers cost the gateway one request per TTL.
    # Auth, cookies and the ah-user-id header are always stripped. Anything not listed is a 404.
    resolver 127.0.0.11 valid=30s ipv6=off;
    location ^~ /ah/ {
        location ~ "^/ah/(?<up>social/feed|stonks/tickers/prices|stonks/security/ticker/[A-Za-z0-9.^=-]+)$" {
            limit_except GET HEAD { deny all; }
            proxy_cache ahapi;
            proxy_cache_key "$up$is_args$args";
            proxy_cache_valid 200 3s;
            proxy_pass https://api.afterhour.com/$up$is_args$args;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header Host api.afterhour.com;
            proxy_set_header User-Agent "AfterMath-Live/1.0 (+https://ah.mphinance.com/live)";
            proxy_set_header Accept-Encoding "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header ah-user-id "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Referer "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 25s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            gzip on;
            gzip_proxied any;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Access-Control-Allow-Origin * always;
        }
        location ~ "^/ah/(?<up>stonks/security/(?:leaderboard|trending)|stonks/security/sec_[0-9a-f]{32}/historic_prices)$" {
            limit_except GET HEAD { deny all; }
            proxy_cache ahapi;
            proxy_cache_key "$up$is_args$args";
            proxy_cache_valid 200 30s;
            proxy_pass https://api.afterhour.com/$up$is_args$args;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header Host api.afterhour.com;
            proxy_set_header User-Agent "AfterMath-Live/1.0 (+https://ah.mphinance.com/live)";
            proxy_set_header Accept-Encoding "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header ah-user-id "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Referer "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 25s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            gzip on;
            gzip_proxied any;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Access-Control-Allow-Origin * always;
        }
        location ~ "^/ah/(?<up>stonks/public/portfolio/prf_[0-9a-f]{32}/summary/live)$" {
            limit_except GET HEAD { deny all; }
            proxy_cache ahapi;
            proxy_cache_key "$up$is_args$args";
            proxy_cache_valid 200 60s;
            proxy_pass https://api.afterhour.com/$up$is_args$args;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header Host api.afterhour.com;
            proxy_set_header User-Agent "AfterMath-Live/1.0 (+https://ah.mphinance.com/live)";
            proxy_set_header Accept-Encoding "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header ah-user-id "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Referer "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 25s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            gzip on;
            gzip_proxied any;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Access-Control-Allow-Origin * always;
        }
        location ~ "^/ah/(?<up>stonks/market/hours/[0-9-]+|public/profile|public/post/[A-Za-z0-9]+)$" {
            limit_except GET HEAD { deny all; }
            proxy_cache ahapi;
            proxy_cache_key "$up$is_args$args";
            proxy_cache_valid 200 120s;
            proxy_pass https://api.afterhour.com/$up$is_args$args;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header Host api.afterhour.com;
            proxy_set_header User-Agent "AfterMath-Live/1.0 (+https://ah.mphinance.com/live)";
            proxy_set_header Accept-Encoding "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header ah-user-id "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Referer "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 25s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            gzip on;
            gzip_proxied any;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Access-Control-Allow-Origin * always;
        }
        return 404;
    }

    # Unknown file-like paths (robots.txt, *.json, *.xml, .well-known/*) must 404,
    # not fall through to the 4.6MB SPA index.html with a 200.
    location ~* \.(txt|json|xml|map|ico|png|jpg|svg|md)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin * always;
    }

    # Proxy MCP health and status checks directly to ah-mcp container
    location ~* ^/(health|status|api/health|api/mcp/health)$ {
        proxy_pass http://ah-mcp:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
    }

    # Serve Python scripts as text/plain for curl and in-memory execution
    location ~* \.py$ {
        root   /usr/share/nginx/html;
        types {
            text/plain py;
        }
        default_type text/plain;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
