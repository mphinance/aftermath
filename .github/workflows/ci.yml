name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Syntax check every script
        run: |
          python -m py_compile $(git ls-files '*.py')
          bash -n scripts/run_watch.sh
      - name: Tests
        run: python -m pytest tests -q --ignore=tests/test_app.py
