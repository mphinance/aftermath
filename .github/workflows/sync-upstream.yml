name: Sync upstream flag list
# Pulls https://telegramscammers.com/accounts.json (the list owner's public open data) into accounts.json daily.
# sync_upstream.py validates before writing; a bad or truncated download never replaces a good file.
# The Coolify watcher fast-forwards from this repo at 13:15 UTC and also runs its own sync.
on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-upstream
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull and validate
        run: python sync_upstream.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- accounts.json; then echo "no changes"; exit 0; fi
          n=$(python -c "import json; print(len(json.load(open('accounts.json'))))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accounts.json
          git commit -m "chore(sync): upstream accounts.json ($n accounts)"
          git push
